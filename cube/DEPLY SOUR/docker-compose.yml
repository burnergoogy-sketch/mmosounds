services:
  sour:
    build: .
    restart: unless-stopped
    ports:
      - "28785:28785/udp"   # optional: lets the desktop Sauerbraten client connect too
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [sour]
volumes:
  caddy_data:
